[project]
name = "ai-construction-risk-delay-predictor"
version = "0.1.0"
description = "AI-powered construction project risk and delay predictor"
readme = "README.md"
authors = [
    { name = "Samiya Shaikh", email = "samiyaazgar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[project.scripts]
ai-construction = "ai_construction:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Phase 7 integration: lets tests import src.* packages directly
# (e.g. from src.llm.analyzer import ...) alongside the existing
# top-level style (from risk.scoring import ...) used by Phase 1-6 tests.
pythonpath = ["."]
testpaths = ["tests"]
