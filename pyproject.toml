[project]
name = "ai-construction-risk-delay-predictor"
version = "0.1.0"
description = "AI-powered construction project risk and delay predictor"
readme = "README.md"
authors = [
    { name = "Samiya Shaikh", email = "samiyaazgar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
]

[project.scripts]
ai-construction = "ai_construction:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pytest>=8.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
